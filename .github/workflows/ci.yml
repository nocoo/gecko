name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@ad43150de3a2be2fa464b5cd2f921dc4fa9f8f0f
    with:
      runtime-version: "1.4.2"
      install-policy: "project"
      coverage-path: "apps/web-dashboard/coverage"
      extra-install-dirs: "apps/web-dashboard"
      test-command: "bun run --cwd apps/web-dashboard test:coverage"
      lint-command: "bun run --cwd apps/web-dashboard lint"
      typecheck-command: "bun run --cwd apps/web-dashboard typecheck"
      l2: true
      l2-command: "bun run test:l2"
      l3: true
      l3-command: "bun run test:e2e:bdd"
      l3-browser: "chromium"
      l3-browser-directory: "apps/web-dashboard"
