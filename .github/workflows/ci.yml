name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/bun-quality.yml@v2026.4
    with:
      ignore-scripts: true
      extra-install-dirs: "apps/web-dashboard"
      test-command: "bun run --cwd apps/web-dashboard test:coverage"
      lint-command: "bun run --cwd apps/web-dashboard lint"
      typecheck-command: "bun run --cwd apps/web-dashboard typecheck"
      enable-l2: "true"
      l2-command: "bun run test:l2"
      enable-l3: "true"
      l3-command: "bun run --cwd apps/web-dashboard test:bdd"
    secrets: inherit
